name: CI/CD - Docker Hub to GKE

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: gcp-devops-showcase

jobs:
  build-push-deploy:
    name: Build, Push and Deploy to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run basic Flask import check
        run: |
          python -m py_compile app/main.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart deployment to pull latest image
        run: |
          kubectl rollout restart deployment/gcp-devops-app

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/gcp-devops-app

      - name: Show Kubernetes resources
        run: |
          kubectl get pods
          kubectl get service
          kubectl get hpa